# Docker compose for integration tests only (US-106A)
# Not for dev, not for prod. Port 5433 to avoid dev DB conflict.
services:
  postgres:
    # pgvector/pgvector = postgres oficial + extensão vector (exigida pela
    # migration 20260603040000_add_knowledge_rag; produção = Supabase, que já
    # tem a extensão). postgres:16-alpine puro quebra o migrate deploy.
    image: pgvector/pgvector:pg16
    container_name: quayer-test-postgres
    restart: "no"
    environment:
      POSTGRES_USER: quayer_test
      POSTGRES_PASSWORD: quayer_test
      POSTGRES_DB: quayer_test
    ports:
      - "5433:5432"
    volumes:
      - quayer-test-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quayer_test -d quayer_test"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  quayer-test-pgdata:
