# ==================================
# 🧪 DOCKER COMPOSE - QUAYER HOMOL
# ==================================
# Stack auto-contida para homologação no servidor 167.235.139.140
# Arquitetura: Cloudflare Tunnel (cloudflared) -> app:3000 -> postgres + redis
#   - Sem nginx, sem porta exposta. cloudflared faz outbound para Cloudflare.
#   - homol.quayer.com (CNAME -> tunnel) é resolvido pelo Cloudflare proxy.
#   - Postgres + Redis isolados, sem expose externa.
#
# Comando: docker compose -f compose.homol.yml --env-file .env.homol up -d
# Stop:    docker compose -f compose.homol.yml --env-file .env.homol down

services:
  # ==================================
  # CLOUDFLARE TUNNEL
  # ==================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homol-quayer-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_HOMOL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - homol-quayer-internal
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  app:
    # Imagem pré-buildada pelo GitHub Actions runner (sem build no servidor → sem OOM)
    # Para buildar: gh workflow run deploy-homol.yml
    image: quayer-app:homol
    container_name: homol-quayer-app
    restart: unless-stopped
    # Sem ports: tráfego entra via cloudflared na rede interna
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}

      # Database (rede interna)
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@homol-quayer-postgres:5432/${DB_NAME}?schema=public
      - DIRECT_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@homol-quayer-postgres:5432/${DB_NAME}?schema=public

      # Redis (rede interna)
      - REDIS_URL=redis://homol-quayer-redis:6379
      - REDIS_HOST=homol-quayer-redis
      - REDIS_PORT=6379

      # Ambiente (lido pelo rate limiter pra ser generoso em homol vs estrito em prod)
      - NEXT_PUBLIC_APP_ENV=homol

      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_MAGIC_LINK_SECRET=${JWT_MAGIC_LINK_SECRET}
      - JWT_2FA_CHALLENGE_SECRET=${JWT_2FA_CHALLENGE_SECRET}
      - IGNITER_APP_SECRET=${IGNITER_APP_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # WebAuthn (passkey)
      - RP_ID=${RP_ID}

      # Signup gate
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-false}

      # Igniter
      - IGNITER_APP_NAME=quayer-homol
      - NEXT_PUBLIC_IGNITER_API_URL=${NEXT_PUBLIC_APP_URL}/
      - NEXT_PUBLIC_IGNITER_API_BASE_PATH=/api/v1
      - IGNITER_JOBS_QUEUE_PREFIX=quayer-homol
      - IGNITER_LOG_LEVEL=debug

      # Email (Resend). Without RESEND_API_KEY the service falls back to
      # MockEmailProvider (writes to disk, never sends a real email).
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Quayer Homol}
      - EMAIL_LOGO_URL=${EMAIL_LOGO_URL:-}
      - EMAIL_BLOCKLIST=${EMAIL_BLOCKLIST:-}
      # EMAIL_PROVIDER=mock forces the mock provider even when RESEND_API_KEY
      # is set. Unset (default) → auto-select Resend if key present, mock otherwise.
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}

      # WhatsApp
      - UAZAPI_URL=${UAZAPI_URL}
      - UAZAPI_BASE_URL=${UAZAPI_BASE_URL}
      - UAZAPI_ADMIN_TOKEN=${UAZAPI_ADMIN_TOKEN}
      - UAZAPI_INSTANCE_TOKEN=${UAZAPI_INSTANCE_TOKEN}
      - UAZAPI_WEBHOOK_URL=${UAZAPI_WEBHOOK_URL}

      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Observability (Sentry) — build de homol usa --webpack
      # (NEXT_BUILD_FLAGS no deploy-homol.yml) para contornar
      # vercel/next.js#87737 + #88844, permitindo @sentry/nextjs subir
      # sem o bug do import-in-the-middle hashed.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_APP_ENV=homol
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}

      # Google OAuth (homol usa redirect URI próprio)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}

      # Storage (homol pode usar bucket separado)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET_MEDIA=${SUPABASE_STORAGE_BUCKET_MEDIA:-homol-media-whatsapp}
      - SUPABASE_STORAGE_BUCKET_PROFILES=${SUPABASE_STORAGE_BUCKET_PROFILES:-homol-profile-pictures}
      - SUPABASE_STORAGE_BUCKET_ATTACHMENTS=${SUPABASE_STORAGE_BUCKET_ATTACHMENTS:-homol-attachments}

    depends_on:
      homol-quayer-postgres:
        condition: service_healthy
      homol-quayer-redis:
        condition: service_healthy
    networks:
      - homol-quayer-internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==================================
  # BULLMQ WORKER (filas: outbound-retry / source-enrich / session-close)
  # ==================================
  # Mesma imagem do app (quayer-app:homol) — só sobrescreve o command para rodar
  # o bundle esbuild do entrypoint dos workers (workers/start-workers.js,
  # produzido por `npm run build:workers` no Dockerfile). Sem este serviço, as
  # filas enfileiram em prod mas NINGUÉM consome (workers inertes). Espelha o
  # env/networks/depends_on do app — precisa de REDIS_URL (filas) + DATABASE_URL
  # (handlers que tocam o DB) + UAZAPI_* (caminho de envio do outbound-retry) +
  # ENCRYPTION_KEY/OPENAI (source-enrich). NÃO é HTTP server → healthcheck por
  # processo (PID 1 vivo), não por porta.
  worker:
    image: quayer-app:homol
    container_name: homol-quayer-worker
    restart: unless-stopped
    # Entrypoint PRÓPRIO (tini direto) para BYPASSAR o docker-entrypoint.sh do app.
    # Sem isso, o entrypoint roda migrations E hardcoda `exec node server.js`,
    # IGNORANDO o command abaixo → o worker subia um 2º Next server (workers
    # inertes) e ainda competia com o `app` pelas migrations (race "column already
    # exists"). Com tini direto, o worker roda DE FATO os workers e não toca migrations.
    entrypoint: ["/sbin/tini", "--"]
    command: ["node", "workers/start-workers.js"]
    environment:
      - NODE_ENV=production

      # Database (rede interna) — handlers de job tocam o DB
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@homol-quayer-postgres:5432/${DB_NAME}?schema=public
      - DIRECT_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@homol-quayer-postgres:5432/${DB_NAME}?schema=public

      # Redis (rede interna) — conexão das filas BullMQ
      - REDIS_URL=redis://homol-quayer-redis:6379
      - REDIS_HOST=homol-quayer-redis
      - REDIS_PORT=6379

      - NEXT_PUBLIC_APP_ENV=homol

      # Auth/crypto — calendar token encryption (AES-GCM) usa ENCRYPTION_KEY
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_MAGIC_LINK_SECRET=${JWT_MAGIC_LINK_SECRET}
      - JWT_2FA_CHALLENGE_SECRET=${JWT_2FA_CHALLENGE_SECRET}
      - IGNITER_APP_SECRET=${IGNITER_APP_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Igniter — mesmo prefixo de fila do app (senão consome filas diferentes)
      - IGNITER_APP_NAME=quayer-homol
      - IGNITER_JOBS_QUEUE_PREFIX=quayer-homol
      - IGNITER_LOG_LEVEL=debug

      # WhatsApp — outbound-retry reenvia a resposta barrada por rate-limit
      - UAZAPI_URL=${UAZAPI_URL}
      - UAZAPI_BASE_URL=${UAZAPI_BASE_URL}
      - UAZAPI_ADMIN_TOKEN=${UAZAPI_ADMIN_TOKEN}
      - UAZAPI_INSTANCE_TOKEN=${UAZAPI_INSTANCE_TOKEN}
      - UAZAPI_WEBHOOK_URL=${UAZAPI_WEBHOOK_URL}

      # OpenAI — source-enrich (embed/síntese)
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Observability (Sentry)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}

      # Storage — source-enrich pode persistir mídia/chunks
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET_MEDIA=${SUPABASE_STORAGE_BUCKET_MEDIA:-homol-media-whatsapp}
      - SUPABASE_STORAGE_BUCKET_PROFILES=${SUPABASE_STORAGE_BUCKET_PROFILES:-homol-profile-pictures}
      - SUPABASE_STORAGE_BUCKET_ATTACHMENTS=${SUPABASE_STORAGE_BUCKET_ATTACHMENTS:-homol-attachments}
    depends_on:
      homol-quayer-postgres:
        condition: service_healthy
      homol-quayer-redis:
        condition: service_healthy
    networks:
      - homol-quayer-internal
    # Healthcheck por processo: o worker não expõe HTTP. Confirma que o PID 1
    # (node) está vivo — graceful shutdown (SIGTERM/SIGINT) já é tratado pelo
    # start-workers.ts. Se o processo morrer, restart: unless-stopped o sobe.
    healthcheck:
      test: ["CMD-SHELL", "ps -o pid= -p 1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  homol-quayer-postgres:
    # pgvector/pgvector:pg15 = Postgres 15 + extensão pgvector (necessária p/ RAG:
    # CREATE EXTENSION vector + coluna vector(1536)). Mesmo major (15) → volume de
    # dados existente (/opt/quayer-homol/data/postgres) é compatível.
    image: pgvector/pgvector:pg15
    container_name: homol-quayer-postgres
    restart: unless-stopped
    # Bind interno apenas — não exposto na máquina
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER:-quayer_homol}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-quayer_homol}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /opt/quayer-homol/data/postgres:/var/lib/postgresql/data
    networks:
      - homol-quayer-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quayer_homol}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c effective_cache_size=512MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB

  homol-quayer-redis:
    image: redis:7-alpine
    container_name: homol-quayer-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - /opt/quayer-homol/data/redis:/data
    networks:
      - homol-quayer-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --save 300 10
      --appendonly yes
      --appendfsync everysec

networks:
  homol-quayer-internal:
    driver: bridge
    name: homol-quayer-internal
