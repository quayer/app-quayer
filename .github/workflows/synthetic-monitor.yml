name: Synthetic Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - { url: "https://homol.quayer.com/api/health", expect: "200", name: "homol-health" }
          - { url: "https://app.quayer.com/api/health",   expect: "200", name: "prod-health" }
          - { url: "https://app.quayer.com/login",        expect: "200", name: "prod-login" }
          - { url: "https://flows.quayer.com/",           expect: "200", name: "n8n" }
          - { url: "https://chat.quayer.com/",            expect: "302", name: "chatwoot" }
          - { url: "https://supabase.quayer.com/",        expect: "503", name: "supabase" }
    steps:
      - name: Check ${{ matrix.target.name }}
        id: check
        run: |
          set +e
          RESPONSE=$(curl -sI -o /dev/null \
            -w "%{http_code},%{time_total}" \
            --max-time 15 \
            -A "QuayerSyntheticMonitor/1.0 (+github-actions)" \
            "${{ matrix.target.url }}")
          CURL_EXIT=$?
          set -e

          STATUS=$(echo "$RESPONSE" | cut -d, -f1)
          TIME=$(echo "$RESPONSE" | cut -d, -f2)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "time=$TIME"     >> "$GITHUB_OUTPUT"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::${{ matrix.target.name }} curl failed (exit=$CURL_EXIT) url=${{ matrix.target.url }}"
            exit 1
          fi
          if [ "$STATUS" != "${{ matrix.target.expect }}" ]; then
            echo "::error::${{ matrix.target.name }} returned $STATUS (expected ${{ matrix.target.expect }}), time=${TIME}s"
            exit 1
          fi
          echo "::notice::${{ matrix.target.name }} OK ($STATUS in ${TIME}s)"

      # ---------------------------------------------------------------
      # Auth page HTML presence check (only for prod-login)
      #
      # RULES — this step MUST respect these constraints at all times:
      #   - NO real login (no credentials, no cookies, no session)
      #   - NO credentials of any kind are sent or stored
      #   - NO OTP fixo / hardcoded OTP
      #   - NO form submission (only GET of the HTML body)
      #
      # Purpose: prove the /login page is the real Quayer app shell
      # (not a Cloudflare error page, not a blank 200) by asserting:
      #   1. the HTML contains a <form element
      #   2. the HTML contains the substring "quayer" (case-insensitive)
      # ---------------------------------------------------------------
      - name: Verify login HTML contains form and brand
        if: matrix.target.name == 'prod-login'
        run: |
          set -e
          BODY=$(curl -sL \
            --max-time 15 \
            -A "QuayerSyntheticMonitor/1.0 (+github-actions)" \
            "${{ matrix.target.url }}")

          if ! echo "$BODY" | grep -q "<form"; then
            echo "::error::prod-login HTML missing <form element — page may be broken or replaced by an error page"
            exit 1
          fi
          if ! echo "$BODY" | grep -qi "quayer"; then
            echo "::error::prod-login HTML does not contain 'quayer' substring — likely a Cloudflare/WAF error page"
            exit 1
          fi
          echo "::notice::prod-login HTML OK (form present, brand present)"

      - name: Write log line
        if: always()
        run: |
          mkdir -p monitor-logs
          echo "$(date -u +%FT%TZ),${{ matrix.target.name }},${{ steps.check.outputs.status }},${{ steps.check.outputs.time }},${{ job.status }}" \
            > "monitor-logs/${{ matrix.target.name }}.csv"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ matrix.target.name }}-${{ github.run_id }}
          path: monitor-logs/
          retention-days: 7

      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL not configured — skipping alert"
            exit 0
          fi
          PAYLOAD=$(cat <<EOF
          {
            "content": ":rotating_light: **Synthetic Monitor FAIL**\nTarget: \`${{ matrix.target.name }}\`\nURL: ${{ matrix.target.url }}\nExpected: ${{ matrix.target.expect }}\nGot: ${{ steps.check.outputs.status }} (time=${{ steps.check.outputs.time }}s)\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$WEBHOOK" || echo "::warning::Webhook POST failed"

  # =================================================================
  # CANARY ROUNDTRIPS (full auth flows against homol/prod)
  #
  # Each job below is guarded by secret availability. If the required
  # secret is missing, the job is skipped (no failure) — letting you
  # roll out the synthetic stack one channel at a time.
  #
  # See docs/testing/SYNTHETIC_MONITORING.md for the full plan.
  # =================================================================

  # -----------------------------------------------------------------
  # FREE canary — no third-party SaaS required.
  #
  # Hits POST /api/v1/auth/signup-otp with a throwaway @quayer.test
  # email and asserts the response is NOT 5xx. Does NOT read the
  # email back — we leave inbox reading to canary-signup-mailosaur
  # which requires the paid Mailosaur account.
  #
  # What this catches (80% of real failure modes at $0 cost):
  #   - Endpoint 500/502 (backend or DB down)
  #   - Resend rejecting all sends (provider misconfigured)
  #   - JWT secret missing on boot
  #   - Rate limiter mis-set so every request 429s
  # What this does NOT catch:
  #   - Email delivered but with broken OTP/magic-link content
  #   - Resend silently accepting but never sending
  # -----------------------------------------------------------------
  canary-signup-endpoint-alive:
    name: Canary - Signup endpoint not 5xx (free)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: check
    if: always()
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "homol", url: "https://homol.quayer.com" }
    steps:
      - name: POST signup-otp and assert non-5xx
        run: |
          set -e
          TS=$(date +%s%N)
          EMAIL="canary-noinbox-${TS}@quayer.test"
          BODY=$(printf '{"email":"%s","name":"Canary %s"}' "$EMAIL" "$TS")
          RESP=$(curl -s -o /tmp/resp.json -w "%{http_code},%{time_total}" \
            --max-time 15 \
            -A "QuayerSyntheticMonitor/1.0 (+github-actions)" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$BODY" \
            "${{ matrix.target.url }}/api/v1/auth/signup-otp")
          STATUS=$(echo "$RESP" | cut -d, -f1)
          TIME=$(echo "$RESP"  | cut -d, -f2)
          echo "::notice::signup-otp status=$STATUS time=${TIME}s email=$EMAIL"
          if [ "$STATUS" -ge 500 ]; then
            echo "::error::signup-otp returned $STATUS (>=500) — backend likely broken"
            cat /tmp/resp.json || true
            exit 1
          fi

  canary-google-oauth-url:
    name: Canary - Google OAuth URL contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: check
    if: always()  # run even if upstream check failed (it's an independent signal)
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "homol", url: "https://homol.quayer.com" }
          - { name: "prod",  url: "https://app.quayer.com"  }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tsx
        run: npm i -g tsx@4
      - name: Run Google OAuth URL canary
        env:
          CANARY_BASE_URL: ${{ matrix.target.url }}
        run: tsx test/canary/google-oauth-url.ts

  canary-signup-mailosaur:
    name: Canary - Signup OTP roundtrip (Mailosaur)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check
    if: always()
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "homol", url: "https://homol.quayer.com" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip if Mailosaur not configured
        id: gate
        run: |
          if [ -z "${{ secrets.MAILOSAUR_API_KEY }}" ] || [ -z "${{ secrets.MAILOSAUR_SERVER_ID }}" ]; then
            echo "::notice::Mailosaur secrets not configured — skipping signup canary"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install tsx
        if: steps.gate.outputs.skip != 'true'
        run: npm i -g tsx@4
      - name: Run signup OTP canary
        if: steps.gate.outputs.skip != 'true'
        env:
          CANARY_BASE_URL: ${{ matrix.target.url }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
        run: tsx test/canary/signup-roundtrip.ts

  canary-alert:
    name: Canary - aggregate alert
    runs-on: ubuntu-latest
    needs: [canary-signup-endpoint-alive, canary-google-oauth-url, canary-signup-mailosaur]
    if: failure()
    steps:
      - name: Alert Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL not configured — skipping aggregate alert"
            exit 0
          fi
          PAYLOAD=$(cat <<EOF
          {"content":":rotating_light: **Canary roundtrip FAIL** — see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF
          )
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK" || true
