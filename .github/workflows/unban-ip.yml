name: Unban IP no host de prod

# ============================================
# Libera um IP bloqueado pelo fail2ban do host de producao.
# Roda a partir dos IPs do GitHub, portanto funciona mesmo quando o IP do
# operador esta banido.
#
# O usuario de deploy so tem sudo para docker/compose/systemctl caddy, logo
# fail2ban-client e alcancado via container privilegiado com chroot no host.
# ============================================

on:
  workflow_dispatch:
    inputs:
      ip:
        description: 'IP para desbloquear'
        required: true
        type: string

jobs:
  unban:
    name: Desbloquear IP
    runs-on: ubuntu-latest
    steps:
      - name: fail2ban unban
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          command_timeout: 5m
          script: |
            IP="${{ github.event.inputs.ip }}"
            echo "alvo: $IP"

            host() {
              sudo docker run --rm --privileged --net=host --pid=host \
                -v /:/host alpine chroot /host "$@"
            }

            echo "=== fail2ban instalado? ==="
            if host sh -c 'command -v fail2ban-client >/dev/null'; then
              echo "sim"
              echo "=== jails ==="
              host fail2ban-client status || true
              echo "=== antes ==="
              host sh -c 'for j in $(fail2ban-client status | sed -n "s/.*Jail list:\s*//p" | tr "," " "); do echo "-- $j"; fail2ban-client status $j | grep -i "banned"; done' || true

              echo "=== unban ==="
              host fail2ban-client unban "$IP" || echo "unban global falhou; tentando por jail"
              host sh -c "for j in \$(fail2ban-client status | sed -n 's/.*Jail list:\s*//p' | tr ',' ' '); do fail2ban-client set \$j unbanip $IP 2>/dev/null && echo \"desbanido em \$j\"; done" || true

              echo "=== depois ==="
              host sh -c 'for j in $(fail2ban-client status | sed -n "s/.*Jail list:\s*//p" | tr "," " "); do echo "-- $j"; fail2ban-client status $j | grep -i "banned"; done' || true
            else
              echo "fail2ban NAO instalado — o bloqueio vem de outro lugar"
            fi

            echo "=== regras de firewall mencionando o IP ==="
            host sh -c "iptables-save 2>/dev/null | grep -F '$IP' || echo '(nenhuma regra com esse IP)'"

            echo "=== sshd ativo e em que porta ==="
            host sh -c 'ss -lntp 2>/dev/null | grep -i ssh || true'
